<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday! 🎉</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.9);
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
      max-width: 450px;
      width: 100%;
      animation: fadeIn 1.5s ease-in-out;
    }
    h1 {
      color: #ff4b2b;
      font-size: 2.2rem;
      margin-bottom: 15px;
    }
    p {
      color: #555;
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 25px;
    }
    .btn {
      background: linear-gradient(to right, #ff416c, #ff4b2b);
      color: white;
      border: none;
      padding: 12px 25px;
      font-size: 1rem;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(255, 75, 43, 0.4);
      transition: transform 0.2s ease;
    }
    .btn:hover {
      transform: scale(1.05);
    }
    .surprise {
      display: none;
      margin-top: 20px;
      font-size: 1.2rem;
      color: #333;
      animation: bounce 1s infinite alternate;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-10px); }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>🎉 Happy Birthday! 🎂</h1>
    <!-- Ganti [Nama Adek] di bawah ini -->
    <p>Selamat ulang tahun buat **[Ananda Sabrina Lukman]**! Semoga panjang umur, sehat selalu, makin pintar, dan semua cita-citanya tercapai ya! ✨🚀</p>
    
    <button class="btn" onclick="showSurprise()">Klik Kejutan 🎁</button>

    <div class="surprise" id="surpriseBox">
      🎈 Semoga harimu menyenangkan dan makin sayang sama keluarga! 🥳✨
    </div>
  </div>

  <script>
    function showSurprise() {
      var box = document.getElementById("surpriseBox");
      if (box.style.display === "block") {
        box.style.display = "none";
      } else {
        box.style.display = "block";
      }
    }
  </script>

</body>
</html>
